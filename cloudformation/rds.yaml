AWSTemplateFormatVersion: '2010-09-09'
Description: RDS PostgreSQL for Roles Application

Parameters:
  pDBUsername:
    Type: String

  pDBPasswordDB:
    Type: String
    NoEcho: true

Resources:
  rDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access
      VpcId: vpc-0a9459de39ac57aaa
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: roles-dev-rds-sg

  rDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RDS
      SubnetIds:
        - subnet-05f686aba946cbc99
        - subnet-0938fad21d7c6a238
      Tags:
        - Key: Name
          Value: roles-dev-db-subnet-group

  rPostgreSQLDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: roles-dev-postgres
      Engine: postgres
      EngineVersion: "15.4"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MasterUsername: !Ref rDBUsername
      MasterUserPassword: !Ref rDBPassword
      DBSubnetGroupName: !Ref rDBSubnetGroup
      VPCSecurityGroups:
        - !Ref rDBSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      StorageType: gp2
      BackupRetentionPeriod: 0
      Tags:
        - Key: Name
          Value: roles-dev-postgres
