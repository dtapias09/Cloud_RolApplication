AWSTemplateFormatVersion: '2010-09-09'
Description: RDS PostgreSQL for Roles Application

Parameters:
  pDBUsername:
    Type: String

  pDBPassword:
    Type: String
    NoEcho: true

Resources:
  rDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access
      VpcId: vpc-0e7b11a12faa59997
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: roles-dev-rds-sg

  rDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RDS
      SubnetIds:
        - subnet-0424aaa48e3b9e555
        - subnet-049e52959fa53e91f
      Tags:
        - Key: Name
          Value: roles-dev-db-subnet-group

  rPostgreSQLDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: roles-dev-postgres
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MasterUsername: !Ref pDBUsername
      MasterUserPassword: !Ref pDBPassword
      DBSubnetGroupName: !Ref rDBSubnetGroup
      VPCSecurityGroups:
        - !Ref rDBSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      StorageType: gp2
      BackupRetentionPeriod: 0
      Tags:
        - Key: Name
          Value: roles-dev-postgres
